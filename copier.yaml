_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name

project_slug:
  type: str
  when: false
  default: "{{ project_name | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"

package_name:
  type: str
  when: false
  default: "{{ project_slug | replace('-', '_') }}"
  
description:
  type: str
  help: Project description
  default: "DESC"

author_name:
  type: str
  help: Your name
  default: "AUTH"

python_version:
  type: str
  help: Python version
  default: "3.12.13"

include_data:
  type: bool
  help: Include a data folder
  default: false

_exclude:
  - "copier.yaml"
  - "copier.yml"
  - ".git"
  - ".DS_Store"
  - "/README.md"
  - "/.gitignore"