_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name
  default: "my-new-project"

package_name: 
  type: str
  help: Package name
  default: "{{ project_name | lower | regex_replace('[^a-z0-9]+', '_') | trim('_') }}"

description:
  type: str
  help: Project description
  default: "Add your description here"

author_name:
  type: str
  help: Your name
  default: "Add your name here"

python_version:
  type: str
  help: Python version
  default: "3.12.13"

include_data:
  type: bool
  help: Include a data folder
  default: false
