_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name

project_slug: "{{ project_name | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"

package_name: "{{ project_slug | replace('-', '_') }}"

description:
  type: str
  help: Project description
  default: "DESCRIPTION"

author_name:
  type: str
  help: Your name
  default: "AUTHOR"

python_version:
  type: str
  help: Python version
  default: "3.12.13"

include_data:
  type: bool
  help: Include a data folder
  default: false
